name: Process Books

on:
  push:
    paths:
      - 'books/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-books
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # calibre handles mobi/azw3 natively AND is the fallback for any epub
      # whose table of contents defeats the native parser, so install it
      # whenever there are books of any kind to process.
      - name: Install calibre
        run: |
          shopt -s nullglob
          book_files=(books/*.mobi books/*.azw3 books/*.epub)
          if [ ${#book_files[@]} -gt 0 ]; then
            echo "Books found, installing calibre..."
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --fix-missing calibre
          else
            echo "No mobi/azw3/epub files — skipping calibre install"
          fi

      - name: Install dependencies
        run: npm install

      - name: Process books
        run: node scripts/process-books.mjs

      - name: Commit generated data
        run: |
          git config user.name "Library Bot"
          git config user.email "library-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: process books [skip ci]"
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr cache
        run: curl -sf "https://purge.jsdelivr.net/gh/WinterWolfWitch/Cathedral-Library@main/data/index.json" || true
